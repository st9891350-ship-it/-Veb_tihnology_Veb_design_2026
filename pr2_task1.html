<!DOCTYPE html>
<html lang="ukr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <fieldset> 
    <legend> Персональна інформація   </legend>
    <form>
  <label for="fname">Name:</label><br>
  <input type="text" id="fname" name="fname" placeholder="your name"><br>
  <label for="lname">Email:</label><br>
  <input type="text" id="lname" name="lname" placeholder="your email">
</form>
  </fieldset><br>

<fieldset> 
<legend>  Додаткова інформація </legend>
<form>
  <label>Стать<span style="color: red;">*</span></label><br>
<input type="radio"  id="information" name="information" value="Чоловік" >
<label for="Чоловік"> Чоловік </label><br>
<input type="radio"  id="information" name="information" value="Жінка" >
<label for="Жінка"> Жінка</label><br>
</form><br>

<form>
  <label>Поточний статус</label><br>
<input type="checkbox"  id="people" name="people" value="Студент" >
<label for="Студент"> Студент </label><br>
<input type="checkbox"  id="people" name="people" value="Працівник" >
<label for="Працівник"> Працівник</label><br>
<input type="checkbox"  id="people" name="people" value="Безробітній" >
<label for="Безробітній">Безробітній</label><br>
</form><br>

<form>
  <label for="birthday">День народження
    <span style="color: red;">*</span> </label> <br>
  <input type="date" id="birthday" name="birthday" 
  min="1900-01-01" max="2026-12-31">
</form><br>


<form>
<label>Навички та технології 
   <span style="color: red;">*</span> </label><br>
 <select name="skiills" size="8" multiple>
<optgroup label="Tech skills">
   <option value="HTML">HTML</option>
    <option value="CSS">CSS</option>
    <option value="JavaSript">JavaSript</option>
</optgroup>
<optgroup  label="Soft skills">
 <option value="Тайм-менеджемент">Тайм-менеджемент</option>
 <option value="Командна робота ">Командна робота</option>
  <option value="Лідерство">Лідерство</option>
</optgroup>
 </select>
</form><br>

<form>
<label>Досвід (в роках) </label><br>
<input type="number" id="experience" name="experience"
 min="0" max="25" step="0.5" value="1" > років</input>
 </form><br>

 <form >
<label for="photo">Фотографія</label><br>
<input type="file" accept="image/*" id="photo" name="photo"> 
</form><br>

<form>
<label for="comment"> Коментарій</label><br>
<textarea  name="message" rows="10"></textarea>
</form>

</fieldset><br>
 
<form action="">

<input type="submit" value="Відправити">
<input type="submit" value="Скинути ">

</form>


</body>
</html>
